<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1440px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: radial-gradient(1100px 760px at 18% -6%, #17222e 0%, #0b0d12 52%, #07090d 100%);
  color: #eef1f6; padding: 66px 70px; overflow: hidden; position: relative;
  -webkit-font-smoothing: antialiased;
}
body::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(600px 400px at 88% 105%, rgba(74,222,128,.10), transparent 70%);
}
.brand { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:700; letter-spacing:.3px; }
.brand .dot { width:16px; height:16px; border-radius:50%; background:#4ade80; box-shadow:0 0 18px rgba(74,222,128,.7); }
.tag {
  display:inline-block; margin-top:26px; font-size:24px; color:#9aa3b2;
  border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:10px 24px;
}
h1 { font-size:86px; line-height:1.16; font-weight:800; letter-spacing:-1.5px; margin-top:26px; }
h1 .hl { color:#4ade80; }
h1 .hl2 { color:#38bdf8; }
.sub { font-size:31px; line-height:1.62; color:#a7b0be; margin-top:28px; font-weight:400; }
.foot { position:absolute; left:70px; right:70px; bottom:56px; font-size:24px; color:#7f8896; display:flex; justify-content:space-between; align-items:center; }
.card { background:linear-gradient(180deg,#1a1f2b,#141821); border:1px solid rgba(255,255,255,.09); border-radius:22px; padding:26px 28px; }
.bar { height:12px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; margin-top:14px; }
.bar > i { display:block; height:100%; border-radius:99px; }

.head2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:40px; font-size:24px; font-weight:700; }
.head2 div { padding:14px 22px; border-radius:14px; text-align:center; }
.head2 .l { background:rgba(248,113,113,.12); color:#f87171; border:1px solid rgba(248,113,113,.3); }
.head2 .r { background:rgba(74,222,128,.12); color:#4ade80; border:1px solid rgba(74,222,128,.32); }
.r { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:14px; }
.c { font-size:21.5px; line-height:1.45; padding:16px 20px; border-radius:14px; display:flex; gap:10px; align-items:flex-start; }
.bad { background:rgba(255,255,255,.035); color:#8b95a4; }
.good { background:rgba(74,222,128,.075); color:#d7f5e2; border:1px solid rgba(74,222,128,.2); }
.x { color:#f87171; font-weight:800; }
.v { color:#4ade80; font-weight:800; }
</style></head><body>
  <div class="brand"><span class="dot"></span>PulseBar</div>
  <div class="tag">想清楚再装</div>
  <h1>它和“清理大师”<br>的<span class="hl">区别</span></h1>
  <div class="head2"><div class="l">一键清理类软件</div><div class="r">PulseBar</div></div>
      <div class="r"><div class="c bad"><span class="x">✕</span>会悄悄结束你的进程</div><div class="c good"><span class="v">✓</span>只诊断，绝不动手（默认）</div></div>
      <div class="r"><div class="c bad"><span class="x">✕</span>微信说关就关，消息丢失</div><div class="c good"><span class="v">✓</span>微信 / 输入法 / 系统进程默认受保护</div></div>
      <div class="r"><div class="c bad"><span class="x">✕</span>任意程序都能被清</div><div class="c good"><span class="v">✓</span>你可以给任意程序点 🔒，永不清</div></div>
      <div class="r"><div class="c bad"><span class="x">✕</span>吹「一键清空内存」</div><div class="c good"><span class="v">✓</span>不吹。讲清楚它到底有多大用</div></div>
      <div class="r"><div class="c bad"><span class="x">✕</span>后台常驻、可能联网</div><div class="c good"><span class="v">✓</span>不联网，不上传任何数据</div></div>
  <div class="foot"><span>你唯一的护城河是诚实</span><span>免费 · 不锁功能</span></div>
</body></html>
