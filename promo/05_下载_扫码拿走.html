<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1440px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: radial-gradient(1100px 760px at 18% -6%, #17222e 0%, #0b0d12 52%, #07090d 100%);
  color: #eef1f6; padding: 66px 70px; overflow: hidden; position: relative;
  -webkit-font-smoothing: antialiased;
}
body::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(600px 400px at 88% 105%, rgba(74,222,128,.10), transparent 70%);
}
.brand { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:700; letter-spacing:.3px; }
.brand .dot { width:16px; height:16px; border-radius:50%; background:#4ade80; box-shadow:0 0 18px rgba(74,222,128,.7); }
.tag {
  display:inline-block; margin-top:26px; font-size:24px; color:#9aa3b2;
  border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:10px 24px;
}
h1 { font-size:86px; line-height:1.16; font-weight:800; letter-spacing:-1.5px; margin-top:26px; }
h1 .hl { color:#4ade80; }
h1 .hl2 { color:#38bdf8; }
.sub { font-size:31px; line-height:1.62; color:#a7b0be; margin-top:28px; font-weight:400; }
.foot { position:absolute; left:70px; right:70px; bottom:56px; font-size:24px; color:#7f8896; display:flex; justify-content:space-between; align-items:center; }
.card { background:linear-gradient(180deg,#1a1f2b,#141821); border:1px solid rgba(255,255,255,.09); border-radius:22px; padding:26px 28px; }
.bar { height:12px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; margin-top:14px; }
.bar > i { display:block; height:100%; border-radius:99px; }

.qr { display:flex; gap:46px; align-items:center; margin-top:52px; }
.qr img { width:430px; height:430px; background:#fff; border-radius:26px; padding:20px; }
.qr .txt { flex:1; }
.qr .txt .k { font-size:27px; color:#9aa3b2; margin-bottom:10px; }
.qr .txt .u { font-size:25px; color:#4ade80; word-break:break-all; line-height:1.5; font-weight:600; }
.qr .txt .step { font-size:23px; color:#8b95a4; margin-top:22px; line-height:1.65; }
.box { margin-top:44px; display:grid; gap:14px; }
.box .line { font-size:24px; color:#a7b0be; display:flex; gap:12px; }
.box .line b { color:#eef1f6; font-weight:600; }
</style></head><body>
  <div class="brand"><span class="dot"></span>PulseBar</div>
  <div class="tag">完全免费 · 永久免费</div>
  <h1>扫码就能<span class="hl">拿走</span></h1>
  <div class="qr">
    <img src="qr-site.png" alt="QR">
    <div class="txt">
      <div class="k">手机扫码，或浏览器打开：</div>
      <div class="u">pulsebar 官网<br>（见评论区置顶链接）</div>
      <div class="step">① 扫码进官网<br>② 点「下载 macOS 版」<br>③ 解压后拖进「应用程序」</div>
    </div>
  </div>
  <div class="box">
    <div class="line"><b>·</b><span>一份安装包，通用全部 Apple M 芯片（M1~M4，含 Air / Pro / mini / iMac / Studio）</span></div>
    <div class="line"><b>·</b><span>需要 macOS 14 或更高版本</span></div>
    <div class="line"><b>·</b><span>首次打开若提示「无法验证开发者」，右键 → 打开即可</span></div>
  </div>
  <div class="foot"><span>觉得有用，请我喝杯咖啡 ☕</span><span>不想打赏也照样全功能</span></div>
</body></html>
