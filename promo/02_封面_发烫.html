<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1440px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: radial-gradient(1100px 760px at 18% -6%, #17222e 0%, #0b0d12 52%, #07090d 100%);
  color: #eef1f6; padding: 66px 70px; overflow: hidden; position: relative;
  -webkit-font-smoothing: antialiased;
}
body::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(600px 400px at 88% 105%, rgba(74,222,128,.10), transparent 70%);
}
.brand { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:700; letter-spacing:.3px; }
.brand .dot { width:16px; height:16px; border-radius:50%; background:#4ade80; box-shadow:0 0 18px rgba(74,222,128,.7); }
.tag {
  display:inline-block; margin-top:26px; font-size:24px; color:#9aa3b2;
  border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:10px 24px;
}
h1 { font-size:86px; line-height:1.16; font-weight:800; letter-spacing:-1.5px; margin-top:26px; }
h1 .hl { color:#4ade80; }
h1 .hl2 { color:#38bdf8; }
.sub { font-size:31px; line-height:1.62; color:#a7b0be; margin-top:28px; font-weight:400; }
.foot { position:absolute; left:70px; right:70px; bottom:56px; font-size:24px; color:#7f8896; display:flex; justify-content:space-between; align-items:center; }
.card { background:linear-gradient(180deg,#1a1f2b,#141821); border:1px solid rgba(255,255,255,.09); border-radius:22px; padding:26px 28px; }
.bar { height:12px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; margin-top:14px; }
.bar > i { display:block; height:100%; border-radius:99px; }

.temp { margin-top:48px; }
.temp .row { display:flex; align-items:baseline; gap:18px; }
.temp .row .v { font-size:150px; font-weight:800; letter-spacing:-5px; line-height:1; }
.temp .row .u { font-size:52px; color:#9aa3b2; font-weight:600; }
.temp .cap { font-size:25px; color:#7f8896; margin-top:8px; }
.split { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:34px; }
.split .card { padding:20px 18px; text-align:center; }
.split .k { font-size:22px; color:#9aa3b2; }
.split .n { font-size:38px; font-weight:800; margin-top:6px; }
</style></head><body>
  <div class="brand"><span class="dot"></span>PulseBar</div>
  <div class="tag">你是不是也这样</div>
  <h1>Mac 一开 Chrome<br>就<span class="hl2">发烫掉电</span>？</h1>
  <div class="sub">不用装笨重的监控软件。<br>菜单栏抬头一眼，就知道是谁在烧。</div>

  <div class="temp card">
    <div class="row"><span class="v" style="color:#4ade80">56</span><span class="u">°C 全机最高</span></div>
    <div class="cap">Apple M1 Pro · 风扇 1798 RPM</div>
    <div class="bar"><i style="width:56%;background:linear-gradient(90deg,#4ade80,#fbbf24)"></i></div>
  </div>

  <div class="split">
    <div class="card"><div class="k">CPU</div><div class="n" style="color:#4ade80">52°</div></div>
    <div class="card"><div class="k">GPU</div><div class="n" style="color:#38bdf8">48°</div></div>
    <div class="card"><div class="k">SSD</div><div class="n" style="color:#fbbf24">44°</div></div>
    <div class="card"><div class="k">电池</div><div class="n" style="color:#a78bfa">33°</div></div>
  </div>

  <div class="foot"><span>有风扇的机型显示转速</span><span>MacBook Air 没风扇就不显示</span></div>
</body></html>
